<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>メニュー構成の試作</title>
<!--
  Android 版のメニュー構成を触って確かめる試作（設計書 4.3・4.4.1〜4.4.3 の【案】）。
  ブラウザで開くだけで動く。外のファイルや通信は使わない。
  「すべての機能」の名前は、拡張機能の src/core/actionTree.ts（ACTION_TREE）から取り出した。
  本文・作品名・提案は、試作のための作り話。
-->
<style>
:root{
  --bg:#f4f2ec; --ink:#2c2c2a; --sub:#6b6a64; --line:#ddd6c8;
  --paper:#fffdf8; --bar:#efebe2; --acc:#0f6e56; --acc2:#e3f0ea; --warn:#a4462b;
  --chip:#f0ede5; --shadow:0 2px 10px #0002;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1c1a; --ink:#e8e6e0; --sub:#a09e96; --line:#3a3934;
    --paper:#262522; --bar:#2f2e2a; --acc:#5cc7a4; --acc2:#23352f; --warn:#e48d70;
    --chip:#33322d; --shadow:0 2px 10px #0008;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif;font-size:14px}
button{font:inherit;color:inherit}
header.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
header.top h1{font-size:16px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.note{color:var(--sub);font-size:12px}
main{display:flex;gap:16px;padding:16px;align-items:flex-start;flex-wrap:wrap}
#stageWrap{flex:1 1 560px;min-width:0;display:flex;justify-content:center;align-items:flex-start}
#stage{transform-origin:top center}
.dev{background:#1f1f1f;border-radius:24px;padding:12px;box-shadow:var(--shadow)}
.scr{background:var(--paper);border-radius:12px;overflow:hidden;position:relative;display:flex;flex-direction:column}
aside.log{flex:0 1 300px;min-width:260px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px}
aside.log h2{font-size:14px;margin:0 0 8px}
.tasks label{display:flex;gap:6px;align-items:flex-start;margin:4px 0;font-size:13px}
.tasks .done{color:var(--acc);font-weight:600}
.count{font-size:22px;font-weight:700}
#trail{list-style:none;margin:6px 0 0;padding:0;max-height:260px;overflow:auto;font-size:12px;color:var(--sub)}
#trail li{padding:2px 0;border-bottom:1px dashed var(--line)}
.btnline{border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:4px 10px;cursor:pointer}

/* 画面の中 */
.appbar{height:48px;flex:0 0 48px;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 6px}
.appbar .ttl{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.ib{border:0;background:transparent;min-width:40px;height:40px;border-radius:20px;cursor:pointer;font-size:15px;padding:0 8px}
.ib:hover{background:var(--chip)}
.pill{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:10px;padding:1px 7px;white-space:nowrap}
.body{flex:1;display:flex;min-height:0;position:relative}
.col{display:flex;flex-direction:column;min-width:0;min-height:0}
.scroll{flex:1;overflow:auto;min-height:0}
.tabs{height:60px;flex:0 0 60px;border-top:1px solid var(--line);display:flex;background:var(--bar)}
.tabs button{flex:1;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;position:relative}
.tabs button .ic{font-size:18px}
.tabs button.on{color:var(--acc);font-weight:700}
.badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--warn);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;min-width:16px;text-align:center}
.rail{width:76px;flex:0 0 76px;border-right:1px solid var(--line);background:var(--bar);display:flex;flex-direction:column;padding-top:8px}
.rail button{border:0;background:transparent;cursor:pointer;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;position:relative}
.rail button .ic{font-size:18px}
.rail button.on{color:var(--acc);font-weight:700}
.rail .badge{top:4px;left:calc(50% + 4px)}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none}
.row:hover{background:var(--chip)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:12px;color:var(--sub)}
.row.sel{background:var(--acc2)}
.sec{padding:10px 14px 4px;font-size:12px;color:var(--sub);font-weight:700}
.ai{font-size:10px;border:1px solid var(--acc);color:var(--acc);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
.fab{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:16px;border:0;background:var(--acc);color:#fff;font-size:26px;cursor:pointer;box-shadow:var(--shadow)}
.today{margin:10px 14px;padding:8px 12px;border-radius:8px;background:var(--acc2);font-size:13px}
.ms{writing-mode:vertical-rl;font-family:"Yu Mincho","Noto Serif JP","MS Mincho",serif;font-size:17px;line-height:2;padding:18px;height:100%;overflow-x:auto;overflow-y:hidden;outline:none}
.ms rt{font-size:8px;color:var(--sub)}
.ms em.dot{font-style:normal;text-emphasis:filled sesame;-webkit-text-emphasis:filled sesame}
.strip{flex:0 0 44px;display:flex;gap:4px;overflow-x:auto;align-items:center;padding:0 6px;border-top:1px solid var(--line);background:var(--bar)}
.strip button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 8px;cursor:pointer;white-space:nowrap;font-size:12px}
.band{position:absolute;z-index:20;display:flex;gap:2px;background:#333;color:#fff;border-radius:8px;padding:4px;box-shadow:var(--shadow)}
.band button{border:0;background:transparent;color:#fff;padding:6px 8px;cursor:pointer;font-size:12px;white-space:nowrap;border-radius:6px}
.band button:hover{background:#555}
.band .sep{width:1px;background:#666;margin:4px 2px}
.pop{position:absolute;z-index:30;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:200px;padding:4px 0}
.pop .h{font-size:11px;color:var(--sub);padding:6px 14px 2px}
.pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 14px;cursor:pointer}
.pop button:hover{background:var(--chip)}
.scrim{position:absolute;inset:0;background:#0004;z-index:25}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-radius:16px 16px 0 0;box-shadow:var(--shadow);max-height:75%;display:flex;flex-direction:column}
.sheet .grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto}
.sheet h3{margin:0;padding:4px 16px 8px;font-size:15px}
.drawer{position:absolute;top:0;right:0;bottom:0;width:50%;z-index:30;background:var(--paper);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column}
.side{border-left:1px solid var(--line);display:flex;flex-direction:column}
.subtabs{display:flex;border-bottom:1px solid var(--line)}
.subtabs button{flex:1;border:0;background:transparent;padding:10px 0;cursor:pointer}
.subtabs button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 -2px var(--acc)}
.search{margin:10px 12px;display:flex;gap:6px}
.search input{flex:1;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.where{font-size:11px;color:var(--acc)}
.gone{opacity:.5}
.prop{padding:10px 14px;border-bottom:1px solid var(--line)}
.prop .k{font-size:11px;color:var(--sub)}
.prop .acts{display:flex;gap:6px;margin-top:6px}
.prop .acts button{border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:3px 10px;cursor:pointer}
.chat{display:flex;flex-direction:column;gap:8px;padding:12px}
.msg{max-width:85%;padding:8px 10px;border-radius:10px;font-size:13px;line-height:1.6}
.msg.me{align-self:flex-end;background:var(--acc2)}
.msg.ai{align-self:flex-start;background:var(--chip)}
.msg button{margin-top:6px}
.toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);z-index:40;background:#333;color:#fff;border-radius:8px;padding:8px 12px;font-size:12px;max-width:90%;box-shadow:var(--shadow);line-height:1.6}
.empty{padding:24px;color:var(--sub);text-align:center}
/* 日本語キーボード（IME）の見本。原稿を押すと画面の下に出る */
.kbd{--kb:#d3d6db;--key:#fff;--key2:#bcc0c7;--kink:#202124;flex:0 0 auto;background:var(--kb);color:var(--kink);display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;font-family:"Yu Gothic UI","Meiryo",sans-serif}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .kbd{--kb:#202124;--key:#3c4043;--key2:#2d2f33;--kink:#e8eaed} }
:root[data-theme="dark"] .kbd{--kb:#202124;--key:#3c4043;--key2:#2d2f33;--kink:#e8eaed}
.kbd .cand{height:38px;flex:0 0 38px;display:flex;align-items:center;gap:2px;padding:0 4px;overflow:hidden;border-bottom:1px solid #0001}
.kbd .cand button{border:0;background:transparent;color:inherit;padding:6px 10px;font-size:15px;cursor:pointer;white-space:nowrap;border-radius:6px}
.kbd .cand button:hover{background:#0001}
.kbd .cand .pre{color:var(--acc);text-decoration:underline;padding:0 6px;font-size:15px}
.kbd .cand .grow{flex:1}
.kbd .keys{flex:1;display:grid;gap:5px;padding:5px}
.kbd .k{border:0;border-radius:6px;background:var(--key);color:inherit;font-size:17px;cursor:pointer;box-shadow:0 1px 0 #0003;padding:0;min-width:0}
.kbd .k.f{background:var(--key2);font-size:12px}
.kbd .k.go{background:var(--acc);color:#fff;font-size:13px}
.kbd .k:active{filter:brightness(.85)}
.kbd .k small{display:block;font-size:9px;opacity:.6;line-height:1}
details.more summary{cursor:pointer;padding:12px 14px;color:var(--sub)}
.est{margin:12px 14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;line-height:1.9}
.primary{border:0;background:var(--acc);color:#fff;border-radius:8px;padding:8px 16px;cursor:pointer}
</style>
</head>
<body>
<header class="top">
  <h1>メニュー構成の試作（Android 版）</h1>
  <span class="seg" id="widthSeg">
    <button data-w="narrow" class="on">狭い（スマホの縦）</button>
    <button data-w="medium">中（スマホの横）</button>
    <button data-w="wide">広い（タブレット）</button>
  </span>
  <span class="note">長押しは、押したまま 0.5 秒か右クリック。本文・作品名は作り話。</span>
</header>
<main>
  <div id="stageWrap"><div id="stage"><div class="dev"><div class="scr" id="scr"></div></div></div></div>
  <aside class="log">
    <h2>試してみること</h2>
    <div class="tasks" id="tasks"></div>
    <h2 style="margin-top:12px">押した回数 <span class="count" id="taps">0</span></h2>
    <button class="btnline" id="reset">数え直す</button>
    <ul id="trail"></ul>
    <p class="note">「試してみること」は、たどり着いた時点の押した回数を記録します。手数が多すぎる所を見つけるための欄です。</p>
  </aside>
</main>

<script>

function run(label, via){
  const a = find(label);
  const place = a ? placeOf(a) : '';
  if (TASKS.some(k=>k.id===label) && taskDone[label]==null) { taskDone[label]=taps; renderTasks(); }
  if (label==='AI設定' || label==='設定管理') { goOther('settings'); }
  toast(`（試作）「${esc(label)}」を開きます${a&&a.ai?' <span class="ai">AI</span>':''}<br><span style="opacity:.8">入った道：${esc(via)}${place?'／決めた置き場：'+esc(place):''}</span>`);
}
let toastTimer;
function toast(html){
  scr.querySelectorAll('.toast').forEach(n=>n.remove());
  const d=document.createElement('div'); d.className='toast'; d.innerHTML=html; scr.appendChild(d);
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>d.remove(),3200);
}

/* 長押し（0.5秒）と右クリック */
function longPress(el, fn){
  let t;
  el.addEventListener('pointerdown', e=>{ t=setTimeout(()=>{ t=null; el.dataset.lp='1'; fn(e); },500); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>{ if(t){clearTimeout(t);t=null;} }));
  el.addEventListener('contextmenu', e=>{ e.preventDefault(); el.dataset.lp='1'; fn(e); });
}
function clickUnlessLong(el, fn){ el.addEventListener('click', e=>{ if(el.dataset.lp){ delete el.dataset.lp; return; } fn(e); }); }

/* その場で出す品書き（2段目。5〜7個まで・階層なし） */
function popMenu(e, title, items){
  closePops();
  const r = scr.getBoundingClientRect(), k = scale();
  const scrim = document.createElement('div'); scrim.className='scrim'; scrim.style.background='transparent'; scrim.onclick=closePops;
  const p = document.createElement('div'); p.className='pop';
  p.innerHTML = `<div class="h">${esc(title)}</div>` + items.map((it,i)=>`<button data-i="${i}">${esc(it[0])}${find(it[1]||it[0])?.ai?'<span class="ai">AI</span>':''}</button>`).join('');
  scr.append(scrim,p);
  let x=(e.clientX-r.left)/k, y=(e.clientY-r.top)/k;
  const W=scr.clientWidth,H=scr.clientHeight;
  x=Math.min(x,W-p.offsetWidth-8); y=Math.min(y,H-p.offsetHeight-8);
  p.style.left=Math.max(8,x)+'px'; p.style.top=Math.max(8,y)+'px';
  p.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const it=items[b.dataset.i]; tap(title+' → '+it[0]); closePops(); it[2]?it[2]():run(it[1]||it[0], title+'（長押し）'); });
}
function closePops(){ scr.querySelectorAll('.pop,.scrim,.band,.sheet').forEach(n=>n.remove()); }
function sheet(title, html, bind){
  closePops();
  const scrim=document.createElement('div'); scrim.className='scrim'; scrim.onclick=closePops;
  const s=document.createElement('div'); s.className='sheet'; s.innerHTML=`<div class="grip"></div><h3>${esc(title)}</h3><div class="scroll">${html}</div>`;
  scr.append(scrim,s); bind&&bind(s);
}

function answer(text){
  // 試作：名前の一部が入っていれば、その操作を案内する（本物は拡張機能の「AIに相談」と同じ仕組み）
  const cand = ALL.filter(a=>!hideOf(a)).map(a=>{
    let sc=0; for(let n=a.label.length;n>=2&&!sc;n--) for(let i=0;i+n<=a.label.length;i++) if(text.includes(a.label.slice(i,i+n))){sc=n;break;}
    return {a,sc};
  }).filter(x=>x.sc>=2).sort((x,y)=>y.sc-x.sc);
  if(!cand.length) return {who:'ai',t:'（試作）合う機能が見つかりませんでした。「すべての機能」から名前で探せます。'};
  const a=cand[0].a, p=placeOf(a);
  return {who:'ai',t:`「${a.label}」ですね。${p?'いつもは '+p+' にあります。':''}`,run:a.label};
}

// 狭い段（縦持ち）は12キー、中と広い段（横持ち・タブレット）はローマ字入力の QWERTY を出す
const KBD_H = { narrow:270, medium:170, wide:300 };
const KANA = { 'あ':'あいうえお','か':'かきくけこ','さ':'さしすせそ','た':'たちつてと','な':'なにぬねの','は':'はひふへほ','ま':'まみむめも','や':'やゆよ','ら':'らりるれろ','わ':'わをん','、。':'、。？！','記号':'「」『』……――' };
const MARKS = ['かが','きぎ','くぐ','けげ','こご','さざ','しじ','すず','せぜ','そぞ','ただ','ちぢ','つっづ','てで','とど','はばぱ','ひびぴ','ふぶぷ','へべぺ','ほぼぽ','あぁ','いぃ','うぅゔ','えぇ','おぉ','やゃ','ゆゅ','よょ','わゎ'];
const ROMA = (()=>{ const m={a:'あ',i:'い',u:'う',e:'え',o:'お',nn:'ん',shi:'し',chi:'ち',tsu:'つ',fu:'ふ',ji:'じ','-':'ー'};
  const rows={k:'かきくけこ',s:'さしすせそ',t:'たちつてと',n:'なにぬねの',h:'はひふへほ',m:'まみむめも',y:'やいゆえよ',r:'らりるれろ',w:'わいうえを',g:'がぎぐげご',z:'ざじずぜぞ',d:'だぢづでど',b:'ばびぶべぼ',p:'ぱぴぷぺぽ'};
  for(const c in rows) 'aiueo'.split('').forEach((v,i)=>m[c+v]=rows[c][i]); return m; })();
const CANDS = ['灯台','澪','岬','手紙','父さん','霧','石段','差出人'];
let kbBuf='', kbLast={key:null,t:0,i:0};
function kbdKind(){ return S.kbdKind || (S.w==='narrow'?'12':'qwerty'); }
function kbdEl(){
  const d=document.createElement('div'); d.className='kbd'; d.style.height=KBD_H[S.w]+'px';
  const K=(v,l,cls='',sub='')=>`<button class="k ${cls}" data-k="${esc(v)}">${l}${sub?`<small>${sub}</small>`:''}</button>`;
  let keys;
  if(kbdKind()==='12'){
    keys=`<div class="keys" style="grid-template-columns:1fr 1.3fr 1.3fr 1.3fr 1fr;grid-template-rows:repeat(4,1fr)">
      ${K('←','←','f')}${K('あ','あ','','いうえお')}${K('か','か','','きくけこ')}${K('さ','さ','','しすせそ')}${K('⌫','⌫','f')}
      ${K('→','→','f')}${K('た','た','','ちつてと')}${K('な','な','','にぬねの')}${K('は','は','','ひふへほ')}${K('空白','空白','f')}
      ${K('記号','「」…','f')}${K('ま','ま','','みむめも')}${K('や','や','','ゆよ')}${K('ら','ら','','りるれろ')}<button class="k go" data-k="改行" style="grid-row:span 2">改行</button>
      ${K('切替','あa1','f','ローマ字へ')}${K('゛゜小','゛゜小','f')}${K('わ','わ','','をん')}${K('、。','、。','','？！')}
    </div>`;
  } else {
    const r=s=>s.split('').map(c=>K(c,c)).join('');
    keys=`<div class="keys" style="grid-template-columns:repeat(20,1fr);grid-template-rows:repeat(4,1fr)">
      ${'qwertyuiop'.split('').map(c=>K(c,c).replace('class="k ','style="grid-column:span 2" class="k ')).join('')}
      <span></span>${'asdfghjkl'.split('').map(c=>K(c,c).replace('class="k ','style="grid-column:span 2" class="k ')).join('')}<span></span>
      ${K('-','ー','f').replace('class="k ','style="grid-column:span 3" class="k ')}${'zxcvbnm'.split('').map(c=>K(c,c).replace('class="k ','style="grid-column:span 2" class="k ')).join('')}${K('⌫','⌫','f').replace('class="k ','style="grid-column:span 3" class="k ')}
      ${K('切替','あa1','f').replace('class="k ','style="grid-column:span 3" class="k ')}${K('記号','「」…','f').replace('class="k ','style="grid-column:span 2" class="k ')}${K('←','←','f').replace('class="k ','style="grid-column:span 2" class="k ')}${K('空白','空白').replace('class="k ','style="grid-column:span 6" class="k ')}${K('→','→','f').replace('class="k ','style="grid-column:span 2" class="k ')}${K('、。','、。','f').replace('class="k ','style="grid-column:span 2" class="k ')}<button class="k go" data-k="改行" style="grid-column:span 3">改行</button>
    </div>`;
  }
  d.innerHTML=`<div class="cand"><span class="pre"></span>${CANDS.map(c=>`<button data-c="${c}">${c}</button>`).join('')}<span class="grow"></span><button data-k="閉じる" title="キーボードを閉じる">▼</button></div>${keys}`;
  // 押しても原稿から焦点を外さない（外すとキーボードが閉じる）
  d.addEventListener('mousedown',e=>e.preventDefault());
  d.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>kbKey(b.dataset.k));
  d.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ tap('キーボードの候補：'+b.dataset.c); focusMs(); kbBuf=''; ins(b.dataset.c); kbPre(); });
  return d;
}
function focusMs(){
  const ms=scr.querySelector('#ms'); if(!ms) return;
  if(document.activeElement!==ms){ ms.focus({preventScroll:true}); const r=document.createRange(); r.selectNodeContents(ms); r.collapse(false); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
}
function ins(t){ document.execCommand('insertText',false,t); }
function kbPre(){ const p=scr.querySelector('.kbd .pre'); if(p) p.textContent=kbBuf; }
function showKbd(){
  if(S.tab!=='write' || scr.querySelector('.kbd')) return;
  S.kbd=true; scr.appendChild(kbdEl()); tap('原稿を押す → キーボードが出る');
  if(taskDone['キーボード']==null){ taskDone['キーボード']=taps; renderTasks(); }
}
function hideKbd(){ S.kbd=false; kbBuf=''; scr.querySelectorAll('.kbd').forEach(n=>n.remove()); }
function kbKey(k){
  focusMs(); const sel=getSelection(), now=Date.now();
  if(k==='閉じる'){ tap('キーボードを閉じる（▼）'); hideKbd(); scr.querySelector('#ms')?.blur(); return; }
  if(k==='切替'){ tap('キーボード：あa1'); S.kbdKind = kbdKind()==='12'?'qwerty':'12'; kbBuf=''; scr.querySelector('.kbd').replaceWith(kbdEl()); return; }
  if(k==='⌫'){ if(kbBuf){ kbBuf=kbBuf.slice(0,-1); kbPre(); } else document.execCommand('delete'); kbLast.key=null; return; }
  if(k==='←'||k==='→'){ sel.modify('move',k==='←'?'backward':'forward','character'); kbLast.key=null; return; }
  if(k==='空白'){ ins('　'); kbLast.key=null; return; }
  if(k==='改行'){ if(kbBuf){ ins(kbBuf); kbBuf=''; kbPre(); } else document.execCommand('insertParagraph'); kbLast.key=null; return; }
  if(k==='゛゜小'){ // 直前の字を、濁点・半濁点・小さい字へ順に替える
    sel.modify('extend','backward','character'); const c=sel.toString(), m=MARKS.find(x=>x.includes(c));
    if(m) ins(m[(m.indexOf(c)+1)%m.length]); else sel.collapseToEnd(); return; }
  if(KANA[k]){ // 12キー：同じキーを続けて押すと、次の字へ（あ→い→う）
    const cyc=KANA[k];
    if(kbLast.key===k && now-kbLast.t<1000){ kbLast.i=(kbLast.i+1)%cyc.length; document.execCommand('delete'); }
    else kbLast.i=0;
    ins(cyc[kbLast.i]); kbLast.key=k; kbLast.t=now; return; }
  // QWERTY：ローマ字をかなにする
  kbBuf+=k;
  if(/^([kstnhmyrwgzdbp])\1$/.test(kbBuf)){ ins('っ'); kbBuf=kbBuf[1]; }
  else if(/^n[^aiueoyn]$/.test(kbBuf)){ ins('ん'); kbBuf=kbBuf[1]; }
  if(ROMA[kbBuf]){ ins(ROMA[kbBuf]); kbBuf=''; }
  else if(kbBuf.length>=4 || (kbBuf.length>=3 && !/^(sh|ch|ts)/.test(kbBuf))){ ins(kbBuf); kbBuf=''; }
  kbPre();
}
function scale(){ const st=document.getElementById('stage'); const m=/scale\(([\d.]+)\)/.exec(st.style.transform); return m?+m[1]:1; }
function fit(){
  const wrap=document.getElementById('stageWrap'), st=document.getElementById('stage');
  st.style.transform='none';
  // 幅と高さの両方に収める（下のタブが画面の外へ出ないように）
  const dev=st.firstElementChild;
  const roomH=window.innerHeight-wrap.getBoundingClientRect().top-16;
  const k=Math.min(1,(wrap.clientWidth-4)/dev.offsetWidth,Math.max(.35,roomH/dev.offsetHeight));
  st.style.transform=`scale(${k})`; wrap.style.height=(dev.offsetHeight*k)+'px';
}
window.addEventListener('resize',fit);

function goOther(page){ S.tab='other'; S.otherPage=page; render(); }

function bind(){
  scr.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ tap('タブ：'+b.textContent.replace(/\d+$/,'').trim()); S.tab=b.dataset.tab; if(S.tab==='other') S.otherPage=null; if(S.tab==='works') S.inWork=false; render(); });
  scr.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{ tap('横の板：'+b.textContent); S.sideTab=b.dataset.side; render(); });
  scr.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>{
    const a=b.dataset.act;
    if(a==='back'){ tap('戻る'); if(S.tab==='other'){ S.otherPage=null; } else if(S.tab==='write'){ S.tab='works'; S.inWork=true; } else if(S.tab==='works'){ S.inWork=false; } render(); }
    else if(a==='add'){ tap('［＋］'); sheet('作品を足す',`<div class="row" data-x="GitHubから追加"><div class="main"><div class="t">GitHub から取り寄せる</div><div class="s">パソコンで書いている作品を持ってくる</div></div></div><div class="row" data-x="新しく作る"><div class="main"><div class="t">新しく作る</div><div class="s">題を入れるだけ。GitHub に置くかはあとで訊く</div></div></div>`,s=>s.querySelectorAll('[data-x]').forEach(r=>r.onclick=()=>{ tap('作品を足す → '+r.querySelector('.t').textContent); closePops(); run(r.dataset.x,'［作品］の［＋］'); })); }
    else if(a==='more'){ tap('上のバーの［…］'); popMenu(e, S.tab==='write'?'この話':'この作品', [['新しい話'],['章立て提案'],['AIを走らせる',null,()=>runSheet()],['相談パネルを開く','相談パネルを開く',()=>{ if(S.w==='wide'){S.sideTab='chat';render();} else goOther('chat'); }],['メモ追加'],['再開用資料'],['書き出し',null,()=>goOther('publish')]]); }
    else if(a==='search'){ tap('🔍'); goOther('all'); }
    else if(a==='horiz'){ tap(S.horiz?'縦で書く':'横で書く'); S.horiz=!S.horiz; S.kbdKeep=S.kbd; render(); }
    else if(a==='drawer'){ tap('☰ 提案・資料'); S.drawer=true; render(); }
    else if(a==='closedrawer'){ tap('引き出しを閉じる'); S.drawer=false; render(); }
    else if(a==='takeall'){ tap('まとめて採る'); proposals=[]; render(); toast('（試作）未決の提案をまとめて採りました'); }
    else if(a==='say'){ const i=scr.querySelector('#say'); if(!i.value.trim()) return; tap('相談に送る：'+i.value); chatLog.push({who:'me',t:i.value}); chatLog.push(answer(i.value)); render(); }
  });
  scr.querySelectorAll('[data-work]').forEach(r=>{
    const w=WORKS.find(x=>x.id==r.dataset.work);
    clickUnlessLong(r,()=>{ tap('作品：'+w.t); S.work=w; S.inWork=true; if(S.w!=='narrow'){ S.tab='write'; } render(); });
    longPress(r,e=>{ tap('作品を長押し：'+w.t); popMenu(e,w.t,[['題を変える','作品名変更'],['シリーズ連結'],['作品の設定',null,()=>sheet('作品の設定',opsRows(TREE.find(g=>g.label==='作品管理').entries.find(x=>x.label==='作品別設定').items.map(a=>({...a,g:'作品管理',s:'作品別設定'})).filter(a=>!hideOf(a)),'作品を長押し → 作品の設定'),s=>bindRuns(s))],['同期','同期・競合解決'],['登録から外す']]); });
  });
  scr.querySelectorAll('[data-ep]').forEach(r=>{
    clickUnlessLong(r,()=>{ tap(r.dataset.ep==='new'?'第6話を書く':'第'+r.dataset.ep+'話'); S.ep=r.dataset.ep==='new'?5:+r.dataset.ep; S.tab='write'; render(); });
    if(r.dataset.ep!=='new') longPress(r,e=>{ const n=r.dataset.ep; tap('第'+n+'話を長押し'); popMenu(e,'第'+n+'話',[['誤字脱字検知'],['推敲'],['矛盾検知'],['各話あらすじ'],['校正一括実行']]); });
  });
  scr.querySelectorAll('[data-other]').forEach(r=>r.onclick=()=>{ tap('［ほか］→ '+r.querySelector('.t').textContent); S.otherPage=r.dataset.other; render(); });
  scr.querySelectorAll('[data-take],[data-skip]').forEach(b=>b.onclick=()=>{ const i=+(b.dataset.take??b.dataset.skip); tap((b.dataset.take!=null?'採る：':'見送る：')+proposals[i].k); proposals.splice(i,1); render(); });
  scr.querySelectorAll('[data-mat]').forEach(r=>{ clickUnlessLong(r,()=>{ tap('資料：'+r.dataset.mat); toast(`（試作）「${esc(r.dataset.mat)}」の1件を開きます`); });
    longPress(r,e=>{ tap('資料を長押し'); popMenu(e,r.dataset.mat,[['本文から読み直す','人物抽出'],['関係を見る','人物相関図'],['場面検索']]); }); });
  scr.querySelectorAll('[data-strip]').forEach(b=>{ b.onmousedown=e=>e.preventDefault(); b.onclick=()=>{ const v=b.dataset.strip; tap('道具帯：'+v); if(v==='横で書く'||v==='縦で書く'){S.horiz=!S.horiz;S.kbdKeep=S.kbd;render();} else run(v,'キーボードの上の道具帯'); }; });
  bindRuns(scr);
  const q=scr.querySelector('#q'); if(q){ q.oninput=()=>{ allQuery=q.value; scr.querySelector('#allList').innerHTML=allRows(); bindRuns(scr.querySelector('#allList')); }; }
  const g=scr.querySelector('#gone'); if(g) g.onchange=()=>{ showGone=g.checked; scr.querySelector('#allList').innerHTML=allRows(); bindRuns(scr.querySelector('#allList')); };
  const say=scr.querySelector('#say'); if(say) say.onkeydown=e=>{ if(e.key==='Enter'&&!e.isComposing) scr.querySelector('[data-act=say]').click(); };
  const ms=scr.querySelector('#ms'); if(ms){ ms.onmouseup=ms.ontouchend=()=>setTimeout(selBand,0);
    ms.onfocus=showKbd; ms.onclick=showKbd;
    // ほかの所を押して原稿から焦点が外れたら、キーボードを閉じる
    ms.onblur=()=>setTimeout(()=>{ if(document.activeElement!==scr.querySelector('#ms')) hideKbd(); },150); }
}
function bindRuns(root){
  root.querySelectorAll('[data-run]').forEach(r=>r.onclick=()=>{ tap(r.dataset.via+' → '+r.dataset.run); if(r.closest('.sheet')) closePops(); run(r.dataset.run,r.dataset.via); });
}
/* 字を選んだときの帯（設計書 4.4） */
function selBand(){
  const sel=getSelection(); scr.querySelectorAll('.band').forEach(n=>n.remove());
  if(!sel.rangeCount||sel.isCollapsed) return;
  const rr=sel.getRangeAt(0).getBoundingClientRect(), r=scr.getBoundingClientRect(), k=scale();
  const b=document.createElement('div'); b.className='band';
  const word=sel.toString().slice(0,8);
  b.innerHTML=['ルビ','傍点','資料を見る','AI に訊く'].map(x=>`<button>${x}</button>`).join('')+'<span class="sep"></span>'+['コピー','貼り付け'].map(x=>`<button>${x}</button>`).join('');
  scr.appendChild(b);
  // 選んだ所のすぐ下に、横の真ん中をそろえて出す（収まらなければ上）
  const msr=scr.querySelector('#ms').getBoundingClientRect();
  const lo=(msr.left-r.left)/k+4, hi=(msr.right-r.left)/k-b.offsetWidth-4;
  let x=((rr.left+rr.right)/2-r.left)/k-b.offsetWidth/2;
  x=Math.max(lo,Math.min(x,hi));
  // 原稿の下の端（キーボードが出ていればその上）を越えるなら、選んだ所の上に出す
  let y=(rr.bottom-r.top)/k+6; if(y+b.offsetHeight>(msr.bottom-r.top)/k) y=(rr.top-r.top)/k-b.offsetHeight-6;
  b.style.left=Math.max(6,x)+'px'; b.style.top=Math.max(54,y)+'px';
  b.querySelectorAll('button').forEach(btn=>btn.onmousedown=e=>{ e.preventDefault(); const v=btn.textContent; tap('選んだ「'+word+'」→ '+v); b.remove();
    if(v==='資料を見る'){ if(S.w==='wide'){S.sideTab='mat';render();} else if(S.w==='medium'){S.sideTab='mat';S.drawer=true;render();} else sheet('資料：'+word, materialsList()); }
    else if(v==='AI に訊く'){ chatLog.push({who:'me',t:`「${word}」について`}); chatLog.push({who:'ai',t:'（試作）選んだ所について答えます。'}); if(S.w==='wide'){S.sideTab='chat';render();} else goOther('chat'); }
    else run(v,'字を選んだときの帯'); });
}

document.querySelectorAll('#widthSeg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#widthSeg button').forEach(x=>x.classList.toggle('on',x===b));
  S.w=b.dataset.w; S.drawer=false; if(S.w!=='narrow'&&S.tab==='works'&&S.inWork) S.tab='write'; render();
});
renderTasks(); render();
</script>
